narrative:
  headline: "SDET who extended test design discipline from deterministic systems to AI agents"
  exit_story: >-
    Five years proving out other people's systems — mobile, web, warehouse robotics —
    and then AI agents arrived and broke the assumption test engineering was built on:
    that correctness is binary. I moved toward that break rather than away from it.
    At Handshake AI I design reproducible evaluation environments for coding agents;
    on my own time I build the agent systems themselves, and I build them the way a
    tester would — a multi-agent equity research crew that validates before it
    recommends, a RAG assistant that refuses to answer without a citation, a payments
    core proved out with property-based tests over integer paise. I am looking for the
    role where those two halves are the same job: building AI systems, and being the
    person who can prove they work.
  superpowers:
    - "Test design that survives non-determinism — objective pass/fail criteria for AI agents whose correctness is probabilistic"
    - "Owning test infrastructure end to end: in-house PyTest + Page Object Model frameworks, CI/CD-integrated, flake-free"
    - "Builds the systems he evaluates — multi-agent LLM applications designed around grounding, validation and citation"
    - "Full-stack quality range: functional, API, mobile, and JMeter performance/load testing under peak throughput"
  proof_points:
    - name: "equity-crew — multi-agent equity research (CrewAI)"
      url: "https://github.com/raghavg27/equity-crew"
      hero_metric: "Five specialised agents fusing fundamentals, neural news search, from-scratch technical indicators and sector peer benchmarking into a validated BUY/HOLD/SELL PDF report"
    - name: "git-guide — multi-agent RAG over GitLab documentation"
      url: "https://github.com/raghavg27/git-guide"
      hero_metric: "CrewAI + ChromaDB + Streamlit; async parallel processing and smart routing, with answers grounded and citation-enforced against source docs"
    - name: "squared-up — India-first expense splitter (Django/DRF + React PWA)"
      url: "https://github.com/raghavg27/squared-up"
      hero_metric: "Money core held in integer paise and verified with Hypothesis property-based tests; UPI one-tap settlement, installable PWA, Dockerised"

